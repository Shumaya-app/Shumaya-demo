document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

orm:translateY(0) rotate(9deg)}50%{transform:translateY(-18px) rotate(6deg)}}\n  @keyframes rise{from{transform:scaleY(.2);opacity:.4}to{transform:scaleY(1);opacity:1}}\n  .sh-h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(34px,7vw,64px);line-height:1.02;letter-spacing:-.04em}\n  .sh-h2{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(27px,4.6vw,44px);line-height:1.05;letter-spacing:-.04em}\n  .sh-h3{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.035em}\n  img{max-width:100%}\n  .sh-num{font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:-.04em;line-height:1}\n  .sh-mono{font-family:'Space Mono',monospace;letter-spacing:.22em;text-transform:uppercase}\n  .sh-cards{display:flex;gap:24px}\n  .sh-hero{display:flex;align-items:center;gap:50px}\n  .sh-logo{height:40px;width:auto;display:block;object-fit:contain}\n  .sh-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}\n  .sh-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}\n  .sh-grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}\n  .sh-shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh;background:#12100E}\n  .sh-burger{display:none}\n  .sh-ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n  .sh-bar{border-radius:6px 6px 3px 3px;transform-origin:bottom;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}\n  @media(max-width:1240px){.sh-bg{display:none !important}}\n  @media(max-width:720px){\n    .sh-grid4{grid-template-columns:1fr 1fr}\n    .sh-pad{padding-top:44px !important;padding-bottom:44px !important}\n    .sh-cta{width:100%;justify-content:center;font-size:18px !important;padding:19px 24px !important}\n    .sh-lede{font-size:19px !important}\n    .sh-sub{font-size:17px !important}\n  }\n  @media(max-width:1000px){\n    .sh-hero{flex-direction:column;align-items:flex-start}\n    .sh-cards{flex-direction:column}\n    .sh-grid4{grid-template-columns:1fr 1fr}\n    .sh-grid3{grid-template-columns:1fr}\n    .sh-grid2{grid-template-columns:1fr}\n    .sh-h1{font-size:40px}\n    .sh-h2{font-size:30px}\n    .sh-pad{padding-left:22px !important;padding-right:22px !important}\n    .sh-phone{display:none !important}\n    .sh-shell{grid-template-columns:1fr}\n    .sh-side{display:none !important}\n    .sh-burger{display:inline-flex !important}\n  }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<sc-if value=\"{{ isLanding }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"width:100%;max-width:1440px;margin:0 auto;background:#F7F2EA;position:relative;overflow:hidden;\">\n\n  <div class=\"sh-bg\" style=\"position:absolute;inset:0;pointer-events:none;z-index:1;\">\n    <div style=\"position:absolute;top:150px;right:80px;width:260px;height:260px;border-radius:50%;background:#DB6418;animation:float1 9s ease-in-out infinite;\"><\u002Fdiv>\n    <div style=\"position:absolute;top:520px;right:40px;width:160px;height:200px;background:#1A1714;transform:rotate(9deg);border-radius:8px;animation:float2 11s ease-in-out infinite;\"><\u002Fdiv>\n    <div style=\"position:absolute;top:430px;right:360px;width:120px;height:40px;background:#F2C14E;border-radius:100px 100px 0 100px;transform:rotate(-14deg);animation:float2 8s ease-in-out infinite;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sh-pad\" style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px 60px 22px;position:relative;z-index:6;\">\n    <img class=\"sh-logo\" src=\"30f544cf-6260-41ae-8111-31141f37a407\" alt=\"shumaya\">\n    <button sc-camel-on-click=\"{{ openLogin }}\" style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;color:#1A1714;background:none;border:1px solid #C9BEA9;border-radius:100px;padding:12px 26px;cursor:pointer;white-space:nowrap;\">Sign in<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"sh-hero sh-pad\" style=\"padding:20px 60px 80px;position:relative;z-index:4;\">\n    <div style=\"flex:1;min-width:0;\">\n      <div class=\"sh-mono\" style=\"font-size:17px;color:#DB6418;margin-bottom:26px;\">Now onboarding in Johannesburg<\u002Fdiv>\n      <h1 class=\"sh-h1\" style=\"margin:0 0 28px;\">Verified trades.<br>Fair prices.<br><span style=\"color:#DB6418;\">Paid every Friday.<\u002Fspan><\u002Fh1>\n      <p class=\"sh-lede\" style=\"font-size:26px;line-height:1.5;color:#4A443C;margin:0 0 40px;max-width:700px;text-wrap:pretty;\">Shumaya sends you customers who have already agreed the price. Every job is paid for before you arrive, so you never chase money again. Free to join, and we only earn when you do.<\u002Fp>\n      <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px;\">\n        <a href=\"https://waitlist.shumaya.app/champion\" target=\"_blank\" rel=\"noopener\" class=\"sh-cta\" style=\"background:#DB6418;color:#1A1714;font-family:'Manrope',sans-serif;font-weight:800;font-size:21px;padding:24px 46px;border-radius:100px;white-space:nowrap;display:inline-flex;align-items:center;\">List my business<\u002Fa>\n        <button sc-camel-on-click=\"{{ openLogin }}\" class=\"sh-cta\" style=\"border:1px solid #C9BEA9;background:none;color:#1A1714;font-family:'Manrope',sans-serif;font-weight:700;font-size:21px;padding:23px 40px;border-radius:100px;white-space:nowrap;cursor:pointer;\">See inside the app<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:17px;color:#8A8377;\">Free to list. No monthly fee. We only earn on jobs you complete.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sh-phone\" style=\"flex:1;display:flex;justify-content:center;\">\n      <div style=\"width:300px;height:600px;background:#1A1714;border-radius:46px;padding:10px;box-shadow:0 60px 120px -30px rgba(26,23,20,.45);position:relative;\">\n        <div style=\"position:absolute;top:110px;left:-4px;width:5px;height:70px;background:#3a342c;border-radius:4px 0 0 4px;\"><\u002Fdiv>\n        <div style=\"position:absolute;top:200px;left:-4px;width:5px;height:70px;background:#3a342c;border-radius:4px 0 0 4px;\"><\u002Fdiv>\n        <div style=\"position:absolute;top:140px;right:-4px;width:5px;height:100px;background:#3a342c;border-radius:0 4px 4px 0;\"><\u002Fdiv>\n        <div style=\"width:100%;height:100%;background:#F7F2EA;border-radius:38px;overflow:hidden;position:relative;\">\n          <div style=\"position:absolute;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font-size:16px;font-weight:700;z-index:9;\">\n            <span>9:41<\u002Fspan><span style=\"letter-spacing:2px;\">▮▮▮ ⌁ ▰<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position:absolute;top:14px;left:50%;transform:translateX(-50%);width:118px;height:32px;background:#1A1714;border-radius:100px;z-index:10;\"><\u002Fdiv>\n          <div style=\"position:absolute;top:58px;left:0;right:0;bottom:0;padding:26px 22px 0;\">\n            <div style=\"font-size:15px;color:#8A8377;\">Job #4821 · Ferndale<\u002Fdiv>\n            <div class=\"sh-h3\" style=\"font-size:30px;margin:4px 0 20px;\">Accept the job<\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #E7DFD3;border-radius:20px;padding:22px;\">\n              <div style=\"font-size:15px;color:#8A8377;margin-bottom:16px;\">Shumaya standard rate · burst geyser<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:14px;font-size:16px;\">\n                <div style=\"display:flex;justify-content:space-between;\"><span style=\"color:#4A443C;\">Labour, 3 hrs<\u002Fspan><span style=\"font-weight:700;\">Agreed<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;\"><span style=\"color:#4A443C;\">Geyser element<\u002Fspan><span style=\"font-weight:700;\">At cost<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;\"><span style=\"color:#4A443C;\">Callout<\u002Fspan><span style=\"font-weight:700;\">Included<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-top:1px solid #EDE6DA;margin-top:18px;padding-top:16px;font-size:15px;color:#8A8377;\">Customer has already paid. Nobody haggles you down.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#DB6418;color:#1A1714;font-family:'Manrope',sans-serif;font-weight:800;font-size:19px;text-align:center;padding:20px;border-radius:100px;margin-top:16px;\">Accept job<\u002Fdiv>\n            <div style=\"text-align:center;font-size:14px;color:#8A8377;margin-top:14px;\">Paid out on Friday, with the rest of the week.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:140px;height:5px;background:#1A1714;border-radius:100px;opacity:.35;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sh-pad\" style=\"background:#fff;padding:80px 60px;position:relative;z-index:4;\">\n    <div class=\"sh-mono\" style=\"font-size:16px;color:#DB6418;margin-bottom:22px;\">How it works<\u002Fdiv>\n    <h2 class=\"sh-h2\" style=\"margin:0 0 40px;\">Four steps. Then you get paid.<\u002Fh2>\n    <div class=\"sh-cards\">\n      <div style=\"flex:1;background:#F7F2EA;border-radius:20px;padding:34px;\">\n        <div class=\"sh-mono\" style=\"color:#DB6418;font-size:17px;\">01<\u002Fdiv>\n        <div class=\"sh-h3\" style=\"margin:16px 0 10px;\">Get verified<\u002Fdiv>\n        <p style=\"font-size:18px;color:#4A443C;margin:0;line-height:1.45;\">ID, trade experience and two references. Once, on WhatsApp, in about a day.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#F7F2EA;border-radius:20px;padding:34px;\">\n        <div class=\"sh-mono\" style=\"color:#DB6418;font-size:17px;\">02<\u002Fdiv>\n        <div class=\"sh-h3\" style=\"margin:16px 0 10px;\">Accept the job<\u002Fdiv>\n        <p style=\"font-size:18px;color:#4A443C;margin:0;line-height:1.45;\">Leads arrive with the job described and a deposit paid. No time wasters.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#F7F2EA;border-radius:20px;padding:34px;\">\n        <div class=\"sh-mono\" style=\"color:#DB6418;font-size:17px;\">03<\u002Fdiv>\n        <div class=\"sh-h3\" style=\"margin:16px 0 10px;\">Do the work<\u002Fdiv>\n        <p style=\"font-size:18px;color:#4A443C;margin:0;line-height:1.45;\">Shumaya writes the quote and the invoice, sends it in your name and chases it.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#1A1714;color:#F7F2EA;border-radius:20px;padding:34px;\">\n        <div class=\"sh-mono\" style=\"color:#DB6418;font-size:17px;\">04<\u002Fdiv>\n        <div class=\"sh-h3\" style=\"margin:16px 0 10px;\">Paid Friday<\u002Fdiv>\n        <p style=\"font-size:18px;color:#CFC7B8;margin:0;line-height:1.45;\">Straight into your account, every week, for every job you closed. Need it sooner? Cash out instantly.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sh-pad\" style=\"padding:80px 60px;position:relative;z-index:4;\">\n    <div class=\"sh-mono\" style=\"font-size:16px;color:#DB6418;margin-bottom:22px;\">The deal, in plain terms<\u002Fdiv>\n    <h2 class=\"sh-h2\" style=\"margin:0 0 16px;\">Work out what you keep.<\u002Fh2>\n    <p class=\"sh-sub\" style=\"font-size:21px;color:#4A443C;max-width:760px;margin:0 0 44px;line-height:1.45;\">Materials you buy and pass on are charged at cost with zero commission. We only earn on your labour. If a customer never pays, we still pay you, and we do the chasing.<\u002Fp>\n    <div class=\"sh-cards\" style=\"align-items:stretch;\">\n      <div style=\"flex:1;background:#fff;border:1px solid #E0D8CA;border-radius:20px;padding:34px;\">\n        <div class=\"sh-mono\" style=\"font-size:13px;color:#8A8377;margin-bottom:24px;\">Work it out<\u002Fdiv>\n        <label style=\"display:block;font-size:17px;color:#4A443C;margin-bottom:10px;\">Labour you charge<\u002Flabel>\n        <div style=\"display:flex;align-items:center;gap:10px;background:#F7F2EA;border:1px solid #E0D8CA;border-radius:16px;padding:0 18px;margin-bottom:22px;\">\n          <span class=\"sh-num\" style=\"font-size:22px;color:#8A8377;\">R<\u002Fspan>\n          <input type=\"number\" min=\"0\" step=\"50\" value=\"{{ labour }}\" sc-camel-on-change=\"{{ setLabour }}\" sc-camel-on-input=\"{{ setLabour }}\" style=\"flex:1;width:100%;border:none;background:none;outline:none;font-family:'Manrope',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.03em;color:#1A1714;padding:14px 0;\">\n        <\u002Fdiv>\n        <label style=\"display:block;font-size:17px;color:#4A443C;margin-bottom:10px;\">Materials, at cost<\u002Flabel>\n        <div style=\"display:flex;align-items:center;gap:10px;background:#F7F2EA;border:1px solid #E0D8CA;border-radius:16px;padding:0 18px;\">\n          <span class=\"sh-num\" style=\"font-size:22px;color:#8A8377;\">R<\u002Fspan>\n          <input type=\"number\" min=\"0\" step=\"50\" value=\"{{ materials }}\" sc-camel-on-change=\"{{ setMaterials }}\" sc-camel-on-input=\"{{ setMaterials }}\" style=\"flex:1;width:100%;border:none;background:none;outline:none;font-family:'Manrope',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.03em;color:#1A1714;padding:14px 0;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#fff;border:1px solid #E0D8CA;border-radius:20px;padding:34px;display:flex;flex-direction:column;gap:24px;\">\n        <div>\n          <div class=\"sh-num\" style=\"font-size:40px;\">{{ customerPays }}<\u002Fdiv>\n          <div style=\"font-size:17px;color:#8A8377;margin-top:8px;\">Customer pays Shumaya, up front<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #EDE6DA;padding-top:24px;\">\n          <div class=\"sh-num\" style=\"font-size:40px;color:#DB6418;\">{{ feeLabel }}<\u002Fdiv>\n          <div style=\"font-size:17px;color:#8A8377;margin-top:8px;\">Service fee, 12% of labour only<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#1A1714;color:#F7F2EA;border-radius:20px;padding:34px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;\">\n        <div>\n          <div class=\"sh-mono\" style=\"font-size:13px;color:#DB6418;margin-bottom:14px;\">You keep<\u002Fdiv>\n          <div class=\"sh-num\" style=\"font-size:52px;color:#DB6418;\">{{ youKeep }}<\u002Fdiv>\n          <div style=\"font-size:17px;color:#A69C8E;margin-top:10px;\">In your account on Friday<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #3a342c;padding-top:20px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;\">\n            <span style=\"font-size:16px;color:#A69C8E;\">Jobs like this per week<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:12px;\">\n              <button sc-camel-on-click=\"{{ fewerJobs }}\" style=\"width:34px;height:34px;border-radius:100px;border:1px solid #3a342c;background:none;color:#F7F2EA;font-size:20px;line-height:1;cursor:pointer;\">−<\u002Fbutton>\n              <span class=\"sh-num\" style=\"font-size:20px;min-width:22px;text-align:center;\">{{ jobsPerWeek }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ moreJobs }}\" style=\"width:34px;height:34px;border-radius:100px;border:1px solid #3a342c;background:none;color:#F7F2EA;font-size:20px;line-height:1;cursor:pointer;\">+<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:16px;color:#A69C8E;\">That is <strong style=\"color:#F7F2EA;\">{{ weekly }}<\u002Fstrong> paid out on Friday.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sh-pad\" style=\"background:#1A1714;color:#F7F2EA;padding:90px 60px;position:relative;z-index:4;\">\n    <div class=\"sh-mono\" style=\"font-size:16px;color:#DB6418;margin-bottom:22px;\">Built for the providers who join first<\u002Fdiv>\n    <h2 class=\"sh-h2\" style=\"margin:0 0 20px;\">The part no one else offers.<\u002Fh2>\n    <p class=\"sh-sub\" style=\"font-size:23px;color:#A69C8E;max-width:900px;margin:0 0 48px;line-height:1.45;\">Every job is logged, priced and paid through the platform. A few months of that is a verifiable trading record in your name, and it unlocks what a cash business never gets.<\u002Fp>\n    <div class=\"sh-cards\">\n      <div style=\"flex:1;background:#241f1a;border-radius:20px;padding:32px;\">\n        <div class=\"sh-mono\" style=\"font-size:12px;color:#DB6418;\">Growth funding<\u002Fdiv>\n        <div class=\"sh-h3\" style=\"margin:12px 0 10px;\">Capital, not a payslip<\u002Fdiv>\n        <p style=\"font-size:17px;color:#A69C8E;margin:0;line-height:1.45;\">Apply for capital priced off your Shumaya trading history. Our first approvals sit at R40,000.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#241f1a;border-radius:20px;padding:32px;\">\n        <div class=\"sh-mono\" style=\"font-size:12px;color:#DB6418;\">Cover and retirement<\u002Fdiv>\n        <div class=\"sh-h3\" style=\"margin:12px 0 10px;\">Look after yourself too<\u002Fdiv>\n        <p style=\"font-size:17px;color:#A69C8E;margin:0;line-height:1.45;\">Health cover and a monthly contribution taken off your payout, built for people who never had a pension fund.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#241f1a;border-radius:20px;padding:32px;\">\n        <div class=\"sh-mono\" style=\"font-size:12px;color:#DB6418;\">Registration and banking<\u002Fdiv>\n        <div class=\"sh-h3\" style=\"margin:12px 0 10px;\">Formally recognised<\u002Fdiv>\n        <p style=\"font-size:17px;color:#A69C8E;margin:0;line-height:1.45;\">CIPC paperwork and a business bank account handled, opening doors that stay closed to informal traders.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sh-pad\" style=\"padding:90px 60px;position:relative;z-index:4;\">\n    <h2 class=\"sh-h1\" style=\"margin:0 0 20px;max-width:900px;\">Do the work.<br>Get paid properly.<\u002Fh2>\n    <p class=\"sh-lede\" style=\"font-size:23px;color:#4A443C;max-width:700px;margin:0 0 40px;line-height:1.45;\">We are onboarding the first Johannesburg providers now. Plumbers, electricians and handymen first. Places are limited per suburb so the work stays worth taking.<\u002Fp>\n    <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\">\n      <a href=\"https://waitlist.shumaya.app/champion\" target=\"_blank\" rel=\"noopener\" class=\"sh-cta\" style=\"background:#DB6418;color:#1A1714;font-family:'Manrope',sans-serif;font-weight:800;font-size:21px;padding:24px 46px;border-radius:100px;white-space:nowrap;display:inline-flex;align-items:center;\">List my business<\u002Fa>\n      <button sc-camel-on-click=\"{{ openLogin }}\" class=\"sh-cta\" style=\"border:1px solid #C9BEA9;background:none;color:#1A1714;font-family:'Manrope',sans-serif;font-weight:700;font-size:21px;padding:23px 40px;border-radius:100px;white-space:nowrap;cursor:pointer;\">See inside the app<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sh-pad\" style=\"border-top:1px solid #E0D8CA;padding:34px 60px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;position:relative;z-index:4;\">\n    <img src=\"30f544cf-6260-41ae-8111-31141f37a407\" alt=\"shumaya\" style=\"height:22px;width:auto;display:block;object-fit:contain;\">\n    <span style=\"font-size:15px;color:#8A8377;\">Johannesburg. Opening suburb by suburb.<\u002Fspan>\n    <span style=\"font-size:15px;color:#8A8377;\">© 2026 Shumaya<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ loginOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:80;background:rgba(18,16,14,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;\">\n    <div style=\"background:#1C1815;border:1px solid #2A2420;border-radius:28px;padding:38px;width:100%;max-width:440px;color:#F2ECE3;box-shadow:0 50px 120px -20px rgba(0,0,0,.7);\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;\">\n        <div>\n          <div class=\"sh-mono\" style=\"font-size:12px;color:#DB6418;\">Provider sign in<\u002Fdiv>\n          <div class=\"sh-h2\" style=\"font-size:32px;margin-top:10px;\">Welcome back.<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeLogin }}\" style=\"background:none;border:none;font-size:28px;line-height:1;color:#8A8377;cursor:pointer;\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"font-size:17px;color:#A69C8E;margin:0 0 20px;line-height:1.45;\">We text you a code. No passwords here.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <input placeholder=\"082 000 0000\" style=\"padding:17px 20px;border:1px solid #2A2420;border-radius:16px;background:#12100E;color:#F2ECE3;font-size:18px;\">\n        <sc-if value=\"{{ codeSent }}\" hint-placeholder-val=\"{{ false }}\">\n          <input placeholder=\"Any 4 digits\" style=\"padding:17px 20px;border:1px solid #2A2420;border-radius:16px;background:#12100E;color:#F2ECE3;font-size:18px;\">\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ gateAction }}\" style=\"padding:19px;border:none;border-radius:100px;background:#DB6418;color:#12100E;font-family:'Manrope',sans-serif;font-weight:800;font-size:18px;cursor:pointer;\">{{ gateLabel }}<\u002Fbutton>\n        <div style=\"font-size:14px;color:#7C7367;text-align:center;\">Demo. any number, any code.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"sh-shell\">\n\n  <div class=\"sh-side\" style=\"background:#17140F;border-right:1px solid #241F1A;padding:22px 14px;display:flex;flex-direction:column;gap:4px;\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:6px 10px 22px;\">\n      <img src=\"d6419e23-b50f-4bc8-ae23-3b4d446ce07f\" alt=\"shumaya\" style=\"height:20px;width:auto;display:block;object-fit:contain;\">\n    <\u002Fdiv>\n    <sc-for list=\"{{ nav }}\" as=\"item\" hint-placeholder-count=\"10\">\n      <div>\n        <div style=\"{{ item.groupStyle }}\">{{ item.group }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ item.go }}\" style=\"{{ item.style }}\">\n          <svg class=\"sh-ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"{{ item.icon }}\"><\u002Fpath><\u002Fsvg>\n          <span style=\"flex:1;text-align:left;\">{{ item.label }}<\u002Fspan>\n          <span style=\"{{ item.badgeStyle }}\">{{ item.badge }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"margin-top:auto;background:#1F1A15;border-radius:14px;padding:14px;\">\n      <div class=\"sh-mono\" style=\"font-size:10px;color:#DB6418;\">Champion tier<\u002Fdiv>\n      <div class=\"sh-num\" style=\"font-size:20px;color:#F2ECE3;margin:8px 0 10px;\">{{ tierLabel }}<\u002Fdiv>\n      <div style=\"height:6px;background:#2A2420;border-radius:100px;overflow:hidden;\">\n        <div style=\"height:100%;width:{{ tierPct }};background:linear-gradient(90deg,#DB6418,#F2C14E);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#7C7367;margin-top:8px;\">{{ tierNext }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"min-width:0;background:#12100E;color:#F2ECE3;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid #241F1A;background:rgba(18,16,14,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:30;\">\n      <div style=\"display:flex;align-items:center;gap:12px;min-width:0;\">\n        <button class=\"sh-burger\" sc-camel-on-click=\"{{ toggleDrawer }}\" style=\"align-items:center;justify-content:center;width:40px;height:40px;border:1px solid #2A2420;border-radius:12px;background:#1C1815;color:#F2ECE3;font-size:18px;cursor:pointer;\">≡<\u002Fbutton>\n        <div style=\"display:flex;align-items:center;gap:8px;background:#1C1815;border:1px solid #2A2420;border-radius:100px;padding:7px 14px;\">\n          <span style=\"width:8px;height:8px;border-radius:100px;background:#6E9B57;\"><\u002Fspan>\n          <span style=\"font-size:13px;color:#A69C8E;\">Verified · Randburg<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;\">\n        <div style=\"display:flex;align-items:center;gap:10px;background:#1C1815;border:1px solid #2A2420;border-radius:100px;padding:8px 16px;\">\n          <span class=\"sh-mono\" style=\"font-size:10px;color:#7C7367;\">Friday<\u002Fspan>\n          <span class=\"sh-num\" style=\"font-size:16px;color:#DB6418;\">{{ payoutLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ resetDemo }}\" style=\"font-size:13px;font-weight:600;color:#A69C8E;background:#1C1815;border:1px solid #2A2420;border-radius:100px;padding:9px 15px;cursor:pointer;font-family:inherit;white-space:nowrap;\">Reset<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ exitApp }}\" style=\"font-size:13px;font-weight:700;color:#12100E;background:#DB6418;border:none;border-radius:100px;padding:10px 17px;cursor:pointer;font-family:inherit;white-space:nowrap;\">Exit<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ drawerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border-bottom:1px solid #241F1A;background:#17140F;padding:12px 14px;display:flex;flex-direction:column;gap:4px;\">\n        <sc-for list=\"{{ nav }}\" as=\"item\" hint-placeholder-count=\"10\">\n          <button sc-camel-on-click=\"{{ item.go }}\" style=\"{{ item.style }}\">\n            <svg class=\"sh-ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"{{ item.icon }}\"><\u002Fpath><\u002Fsvg>\n            <span style=\"flex:1;text-align:left;\">{{ item.label }}<\u002Fspan>\n            <span style=\"{{ item.badgeStyle }}\">{{ item.badge }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"padding:28px 24px 70px;max-width:1240px;\">\n\n      <sc-if value=\"{{ isToday }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"sh-grid2\" style=\"margin-bottom:14px;\">\n          <div style=\"background:#1C1815;border:1px solid #241F1A;border-radius:22px;padding:26px;\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;\">\n              <div>\n                <div class=\"sh-mono\" style=\"font-size:10px;color:#7C7367;\">Cleared this month<\u002Fdiv>\n                <div class=\"sh-num\" style=\"font-size:46px;margin-top:10px;\">{{ monthLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;background:#1F2A1B;color:#8FBF74;font-size:13px;font-weight:700;padding:6px 12px;border-radius:100px;\">↑ {{ growth }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-end;gap:10px;height:150px;margin:26px 0 12px;\">\n              <sc-for list=\"{{ chart }}\" as=\"bar\" hint-placeholder-count=\"8\">\n                <div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:8px;\">\n                  <div class=\"sh-bar\" style=\"{{ bar.style }}\"><\u002Fdiv>\n                  <div style=\"font-size:11px;color:#9A9084;text-align:center;\">{{ bar.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#1C1815;border:1px solid #241F1A;border-radius:22px;padding:26px;display:flex;flex-direction:column;align-items:center;text-align:center;\">\n            <div class=\"sh-mono\" style=\"font-size:10px;color:#7C7367;align-self:flex-start;\">Funding readiness<\u002Fdiv>\n            <div style=\"position:relative;width:170px;height:170px;margin:14px 0 8px;\">\n              <svg sc-camel-view-box=\"0 0 120 120\" style=\"width:100%;height:100%;transform:rotate(-90deg);\">\n                <circle cx=\"60\" cy=\"60\" r=\"52\" fill=\"none\" stroke=\"#2A2420\" stroke-width=\"12\"><\u002Fcircle>\n                <circle cx=\"60\" cy=\"60\" r=\"52\" fill=\"none\" stroke=\"#DB6418\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-dasharray=\"{{ ringDash }}\"><\u002Fcircle>\n              <\u002Fsvg>\n              <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;\">\n                <div class=\"sh-num\" style=\"font-size:34px;\">{{ fundingPct }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#7C7367;\">{{ fundingStepLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"sh-num\" style=\"font-size:22px;color:#DB6418;\">{{ fundingAmount }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ goFunding }}\" style=\"margin-top:16px;width:100%;padding:13px;border:none;border-radius:12px;background:#DB6418;color:#12100E;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;\">Open funding<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"sh-grid4\" style=\"margin-bottom:14px;\">\n          <sc-for list=\"{{ kpis }}\" as=\"kpi\" hint-placeholder-count=\"4\">\n            <div style=\"background:#1C1815;border:1px solid #241F1A;border-radius:18px;padding:20px;\">\n              <div style=\"width:34px;height:34px;border-radius:10px;background:#241C15;color:#DB6418;display:flex;align-items:center;justify-content:center;margin-bottom:14px;\">\n                <svg class=\"sh-ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"{{ kpi.icon }}\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"sh-num\" style=\"font-size:30px;\">{{ kpi.value }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:#7C7367;margin-top:6px;\">{{ kpi.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div class=\"sh-grid2\">\n          <div style=\"background:#1C1815;border:1px solid #241F1A;border-radius:22px;padding:24px;\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;\">\n              <div class=\"sh-h3\" style=\"font-size:20px;\">Do these now<\u002Fdiv>\n              <span style=\"font-size:12px;color:#7C7367;\">{{ todoCount }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px;\">\n              <sc-for list=\"{{ todos }}\" as=\"todo\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ todo.act }}\" style=\"display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#17140F;border:1px solid #241F1A;border-radius:16px;padding:16px;cursor:pointer;font-family:inherit;color:#F2ECE3;\">\n                  <span style=\"{{ todo.iconStyle }}\">\n                    <svg class=\"sh-ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"{{ todo.icon }}\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fspan>\n                  <span style=\"flex:1;min-width:0;\">\n                    <span style=\"display:block;font-weight:700;font-size:16px;\">{{ todo.title }}<\u002Fspan>\n                    <span style=\"display:block;font-size:13px;color:#7C7367;\">{{ todo.sub }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"color:#DB6418;font-size:18px;\">→<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ noTodos }} d job counts toward funding.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:22px;\">\n              <button sc-camel-on-click=\"{{ inviteOne }}\" style=\"width:100%;padding:14px;border:none;border-radius:14px;background:#12100E;color:#F2ECE3;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;\">Invite by WhatsApp<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ copyRef }}\" style=\"width:100%;padding:14px;border:1px solid rgba(18,16,14,.3);border-radius:14px;background:none;color:#12100E;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;\">{{ copyLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sh-grid3\">\n          <div style=\"background:#1C1815;border:1px solid #241F1A;border-radius:20px;padding:22px;text-align:center;\">\n            <div class=\"sh-num\" style=\"font-size:32px;color:#DB6418;\">{{ extraLabel }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#7C7367;margin-top:6px;\">Extra turnover from invites<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#1C1815;border:1px solid #241F1A;border-radius:20px;padding:22px;text-align:center;\">\n            <div class=\"sh-num\" style=\"font-size:32px;\">{{ takeUp }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#7C7367;margin-top:6px;\">Take-up rate<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#1C1815;border:1px solid #241F1A;border-radius:20px;padding:22px;text-align:center;\">\n            <div class=\"sh-num\" style=\"font-size:32px;\">{{ repeatRate }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#7C7367;margin-top:6px;\">Book you again<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isReputation }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"sh-grid2\" style=\"margin-bottom:14px;\">\n :34px;margin-top:8px;\">96%<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ reviews }}\" as=\"rev\" hint-placeholder-count=\"3\">\n            <div style=\"background:#1C1815;border:1px solid #241F1A;border-radius:18px;padding:20px;display:flex;gap:16px;align-items:flex-start;\">\n              <div style=\"width:44px;height:44px;border-radius:100px;overflow:hidden;flex:none;background:#17140F;\">\n                <image-slot id=\"{{ rev.slotId }}\" shape=\"circle\" placeholder=\"\"><\u002Fimage-slot>\n              <\u002Fdiv>\n              <div style=\"min-width:0;\">\n                <div style=\"display:flex;gap:10px;align-items:center;\">\n                  <span style=\"font-weight:700;font-size:15px;\">{{ rev.who }}<\u002Fspan>\n                  <span style=\"color:#F2C14E;font-size:13px;letter-spacing:1px;\">{{ rev.stars }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:14px;color:#A69C8E;margin-top:5px;\">{{ rev.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isCover }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"sh-grid3\" style=\"margin-bottom:14px;\">\n          <sc-for list=\"{{ covers }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"background:#1C1815;border:1px solid #241F1A;border-radius:22px;padding:26px;display:flex;flex-direction:column;\">\n              <div style=\"width:38px;height:38px;border-radius:12px;background:#241C15;color:#DB6418;display:flex;align-items:center;justify-content:center;margin-bottom:18px;\">\n                <svg class=\"sh-ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"{{ c.icon }}\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"sh-h3\" style=\"font-size:20px;\">{{ c.title }}<\u002Fdiv>\n              <div class=\"sh-mono\" style=\"font-size:11px;color:#DB6418;margin:14px 0 8px;\">{{ c.price }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:#7C7367;\">{{ c.sub }}<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ c.act }}\" style=\"{{ c.btnStyle }}\">{{ c.cta }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#1C1815;border:1px solid #241F1A;border-radius:22px;padding:24px;font-size:15px;color:#A69C8E;\">All three open to Shumaya champions first. Premiums come off your Friday payout, with no broker and no paperwork.<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isCopilot }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#1C1815;border:1px solid #241F1A;border-radius:22px;padding:30px;max-width:760px;\">\n          <div class=\"sh-mono\" style=\"font-size:10px;color:#DB6418;\">Coming soon<\u002Fdiv>\n          <div class=\"sh-h3\" style=\"font-size:24px;margin:12px 0 20px;\">Ask anything about your business<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;\">\n            <sc-for list=\"{{ prompts }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"background:#17140F;border:1px solid #241F1A;border-radius:14px;padding:14px 16px;font-size:15px;color:#A69C8E;\">{{ p.text }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#DB6418;color:#12100E;padding:14px 24px;border-radius:100px;font-size:15px;font-weight:700;z-index:70;box-shadow:0 20px 50px -12px rgba(0,0,0,.6);\">{{ toast }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst I = {\n  home: \"M4 11l8-7 8 7M6 10v10h12V10\",\n  bell: \"M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6zM10 19a2 2 0 004 0\",\n  doc: \"M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h4\",\n  cal: \"M4 6h16v14H4zM4 10h16M9 3v4M15 3v4\",\n  wallet: \"M3 7a2 2 0 012-2h12v3M3 7h18v12H3zM17 13h.01\",\n  chart: \"M4 20V10M10 20V4M16 20v-7M22 20H2\",\n  bank: \"M3 9l9-5 9 5M5 9v9M10 9v9M14 9v9M19 9v9M3 20h18\",\n  users: \"M9 8a3.2 3.2 0 100-6.4A3.2 3.2 0 009 8zM3 19c0-3.3 2.7-5 6-5s6 1.7 6 5M16 5.5a3 3 0 010 5.6\",\n  star: \"M12 3l2.6 6.3 6.4.5-4.9 4.2 1.5 6.5L12 17l-5.6 3.5 1.5-6.5L3 9.8l6.4-.5z\",\n  shield: \"M12 3l7 3v5.5c0 4.6-3 8.2-7 9.5-4-1.3-7-4.9-7-9.5V6zM9 12l2 2 4-4.5\",\n  spark: \"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\",\n  cash: \"M3 6h18v12H3zM12 9a3 3 0 100 6 3 3 0 000-6\",\n  tool: \"M14 4a4 4 0 015 5l-9 9-5 1 1-5z\"\n};\n\nconst NAV = [\n  [\"today\", \"Today\", \"Work\", I.home],\n  [\"leads\", \"Leads\", \"\", I.bell],\n  [\"jobs\", \"Jobs\", \"\", I.doc],\n  [\"schedule\", \"Schedule\", \"\", I.cal],\n  [\"wallet\", \"Wallet\", \"Money\", I.wallet],\n  [\"payouts\", \"Payouts\", \"\", I.chart],\n  [\"funding\", \"Funding\", \"\", I.bank],\n  [\"customers\", \"Customers\", \"Grow\", I.users],\n  [\"reputation\", \"Reputation\", \"\", I.star],\n  [\"cover\", \"Cover\", \"\", I.shield],\n  [\"copilot\", \"Copilot\", \"\", I.spark]\n];\n\nconst START = {\n  leads: [\n    { id: 1, title: \"Burst geyser\", meta: \"Ferndale · 2.4 km · today\", tag: \"URGENT\", pay: 1434 },\n    { id: 2, title: \"Leaking tap\", meta: \"Northcliff · 4.1 km · Thu\", tag: \"\", pay: 528 },\n    { id: 3, title: \"Bathroom re-pipe\", meta: \"Blairgowrie · 3.0 km · next week\", tag: \"\", pay: 5632 }\n  ],\n  jobs: [{ id: 4, title: \"Blocked drain\", meta: \"Parkhurst · on site this morning\", pay: 750 }],\n  payout: 4120,\n  cleared: 3,\n  month: 21400,\n  jobsDone: 87,\n  invited: 12,\n  joined: 7,\n  booked: 5,\n  extra: 6200,\n  fundingDone: 4,\n  approved: false,\n  cashedOut: false,\n  credit: 8000,\n  coverOn: false,\n  copied: false\n};\n\nclass Component extends DCLogic {\n  state = Object.assign({\n    view: \"landing\", screen: \"today\", loginOpen: false, codeSent: false,\n    drawerOpen: false, toast: \"\", labour: 1000, materials: 0, jobsPerWeek: 4, product: \"general\", amount: 40000\n  }, JSON.parse(JSON.stringify(START)));\n\n  money(n) {\n    return \"R\" + Math.round(n).toLocaleString(\"en-US\");\n  }\n\n  flash(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: \"\" }), 2200);\n  }\n\n  go(screen) { this.setState({ screen, drawerOpen: false }); }\n\n  navItems() {\n    let lastGroup = null;\n    return NAV.map(([id, label, group, icon]) => {\n      const active = this.state.screen === id;\n      const badge = id === \"leads\" && this.state.leads.length ? String(this.state.leads.length) : \"\";\n      const showGroup = group && group !== lastGroup;\n      if (group) lastGroup = group;\n      return {\n        id, label, icon, group: showGroup ? group : \"\",\n        groupStyle: showGroup\n          ? \"font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#9A9084;padding:16px 12px 8px;\"\n          : \"display:none;\",\n        go: () => this.go(id),\n        style: \"display:flex;align-items:center;gap:11px;width:100%;font-family:inherit;font-size:14.5px;font-weight:\" +\n          (active ? \"700\" : \"500\") + \";color:\" + (active ? \"#12100E\" : \"#A69C8E\") +\n          \";background:\" + (active ? \"#DB6418\" : \"none\") + \";border:none;border-radius:12px;padding:11px 12px;cursor:pointer;\",\n        badge,\n        badgeStyle: badge\n          ? \"background:\" + (active ? \"rgba(18,16,14,.2)\" : \"#DB6418\") + \";color:\" + (active ? \"#12100E\" : \"#12100E\") +\n            \";font-size:11px;font-weight:700;border-radius:100px;padding:2px 8px;\"\n          : \"display:none;\"\n      };\n    });\n  }\n\n  chartBars() {\n    const vals = [3.1, 4.4, 3.8, 6.2, 5.4, 7.3, 8.6, 10.2];\n    const labels = [\"W1\", \"W2\", \"W3\", \"W4\", \"W5\", \"W6\", \"W7\", \"Now\"];\n    const max = Math.max.apply(null, vals);\n    return vals.map((v, i) => ({\n      label: labels[i],\n      style: \"height:\" + Math.round((v / max) * 100) + \"%;background:\" +\n        (i === vals.length - 1 ? \"linear-gradient(#F2C14E,#DB6418)\" : \"linear-gradient(#8A4F1E,#5C3417)\") +\n        \";animation-delay:\" + (i * 60) + \"ms;\"\n    }));\n  }\n\n  fundingStepList() {\n    const items = [\n      [\"20 jobs completed\", \"Done. 87 on the record.\"],\n      [\"Three months of payouts\", \"Done. Every Friday since you joined.\"],\n      [\"ID and references verified\", \"Done at sign-up.\"],\n      [\"Rating above 4.3\", \"Cleared at 4.8 from 34 reviews.\"],\n      [\"Repeat customers\", \"One regular so far. Three unlocks the limit.\"]\n    ];\n    return items.map(([title, sub], i) => {\n      const done = i < this.state.fundingDone;\n      return {\n        title, sub,\n        dot: done ? \"✓\" : String(i + 1),\n        dotStyle: \"width:28px;height:28px;flex:none;border-radius:100px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:\" +\n          (done ? \"#6E9B57\" : \"#2A2420\") + \";color:\" + (done ? \"#12100E\" : \"#7C7367\") + \";\",\n        cta: done ? \"Done\" : \"Do it\",\n        act: done ? () => {} : () => {\n          this.setState(s => ({ fundingDone: Math.min(5, s.fundingDone + 1) }));\n          this.flash(\"Step done. Record updated.\");\n        },\n        btnStyle: \"white-space:nowrap;font-family:inherit;font-size:13px;font-weight:700;border:none;border-radius:100px;padding:9px 16px;cursor:\" +\n          (done ? \"default\" : \"pointer\") + \";background:\" + (done ? \"none\" : \"#DB6418\") + \";color:\" + (done ? \"#5F574D\" : \"#12100E\") + \";\"\n      };\n    });\n  }\n\n  todoList() {\n    const s = this.state, out = [];\n    const ic = \"width:38px;height:38px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#241C15;color:#DB6418;\";\n    if (s.leads.length) out.push({ title: s.leads[0].title, sub: \"New lead · \" + s.leads[0].meta, icon: I.bell, iconStyle: ic, act: () => this.go(\"leads\") });\n    if (s.jobs.length) out.push({ title: \"Mark \" + s.jobs[0].title.toLowerCase() + \" done\", sub: s.jobs[0].meta, icon: I.doc, iconStyle: ic, act: () => this.go(\"jobs\") });\n    if (s.fundingDone < 5) out.push({ title: \"One step to R40,000\", sub: \"Two more repeat customers to unlock\", icon: I.bank, iconStyle: ic, act: () => this.go(\"funding\") });\n    out.push({ title: \"Cover is opening soon\", sub: \"Funeral, liability and long term\", icon: I.shield, iconStyle: ic, act: () => this.go(\"cover\") });\n    return out;\n  }\n\n  renderVals() {\n    const s = this.state;\n    const fee = s.labour * 0.12;\n    const pct = Math.round((s.fundingDone / 5) * 100);\n    const ready = s.fundingDone >= 5;\n    const circ = 2 * Math.PI * 52;\n    const bar = (w, c) => \"display:block;height:100%;width:\" + w + \"%;background:\" + c + \";border-radius:100px;\";\n\n    return {\n      isLanding: s.view === \"landing\",\n      isApp: s.view === \"app\",\n      loginOpen: s.loginOpen,\n      codeSent: s.codeSent,\n      openLogin: () => this.setState({ loginOpen: true, codeSent: false }),\n      closeLogin: () => this.setState({ loginOpen: false }),\n      gateLabel: s.codeSent ? \"Enter the demo\" : \"Send my code\",\n      gateAction: s.codeSent\n        ? () => this.setState({ loginOpen: false, view: \"app\", screen: \"today\" })\n        : () => this.setState({ codeSent: true }),\n      exitApp: () => this.setState({ view: \"landing\", drawerOpen: false }),\n      resetDemo: () => {\n        this.setState(Object.assign({ screen: \"today\", drawerOpen: false }, JSON.parse(JSON.stringify(START))));\n        this.flash(\"Demo reset.\");\n      },\n      drawerOpen: s.drawerOpen,\n      toggleDrawer: () => this.setState(st => ({ drawerOpen: !st.drawerOpen })),\n      toast: s.toast,\n\n      labour: s.labour,\n      materials: s.materials,\n      setLabour: e => this.setState({ labour: Math.max(0, parseFloat(e.target.value) || 0) }),\n      setMaterials: e => this.setState({ materials: Math.max(0, parseFloat(e.target.value) || 0) }),\n      customerPays: this.money(s.labour + s.materials),\n      feeLabel: \"− \" + this.money(fee),\n      youKeep: this.money(s.labour - fee + s.materials),\n      jobsPerWeek: s.jobsPerWeek,\n      weekly: this.money((s.labour - fee + s.materials) * s.jobsPerWeek),\n      moreJobs: () => this.setState(st => ({ jobsPerWeek: Math.min(20, st.jobsPerWeek + 1) })),\n      fewerJobs: () => this.setState(st => ({ jobsPerWeek: Math.max(1, st.jobsPerWeek - 1) })),\n\n      nav: this.navItems(),\n      isToday: s.screen === \"today\",\n      isLeads: s.screen === \"leads\",\n      isJobs: s.screen === \"jobs\",\n      isSchedule: s.screen === \"schedule\",\n      isWallet: s.screen === \"wallet\",\n      isPayouts: s.screen === \"payouts\",\n      isFunding: s.screen === \"funding\",\n      isCustomers: s.screen === \"customers\",\n      isReputation: s.screen === \"reputation\",\n      isCover: s.screen === \"cover\",\n      isCopilot: s.screen === \"copilot\",\n\n      chart: this.chartBars(),\n      monthLabel: this.money(s.month),\n      growth: \"28%\",\n      payoutLabel: this.money(s.payout),\n      clearedCount: s.cleared,\n      workingLabel: this.money(s.jobs.reduce((a, j) => a + j.pay, 0)),\n      jobsDoneTotal: s.jobsDone,\n\n      kpis: [\n        { icon: I.doc, value: String(s.jobsDone), label: \"Jobs on record\" },\n        { icon: I.users, value: \"23\", label: \"Customers\" },\n        { icon: I.cash, value: this.money(1580), label: \"Average job\" },\n        { icon: I.tool, value: this.money(s.credit), label: \"Materials credit\" }\n ext limit is larger.\",\n\n      tierLabel: s.jobsDone >= 100 ? \"Gold\" : \"Silver\",\n      tierPct: Math.min(100, Math.round((s.jobsDone / 100) * 100)) + \"%\",\n      tierNext: (100 - s.jobsDone > 0 ? (100 - s.jobsDone) + \" jobs to Gold\" : \"Gold unlocked\"),\n\n      noLeads: s.leads.length === 0,\n      noJobs: s.jobs.length === 0,\n      todos: this.todoList(),\n      noTodos: this.todoList().length === 0,\n      todoCount: this.todoList().length + \" open\",\n\n      leads: s.leads.map(l => ({\n        title: l.title, meta: l.meta, tag: l.tag || \"\",\n        slotId: \"lead-photo-\" + l.id,\n        slotHint: \"Drop a \" + l.title.toLowerCase() + \" photo\",\n        payLabel: this.money(l.pay * 0.88),\n        tagStyle: l.tag\n          ? \"position:absolute;top:12px;left:12px;background:#DB6418;color:#12100E;font-size:10px;font-weight:800;letter-spacing:.08em;padding:5px 10px;border-radius:100px;z-index:3;\"\n          : \"display:none;\",\n        accept: () => {\n          this.setState(st => ({\n            leads: st.leads.filter(x => x.id !== l.id),\n            jobs: st.jobs.concat([{ id: l.id, title: l.title, meta: l.meta + \" · accepted\", pay: l.pay }])\n          }));\n          this.flash(\"Accepted. Quote written for you.\");\n        }\n      })),\n\n      jobs: s.jobs.map(j => ({\n        title: j.title, meta: j.meta, payLabel: this.money(j.pay * 0.88),\n        slotId: \"job-photo-\" + j.id,\n        complete: () => {\n          this.setState(st => ({\n            jobs: st.jobs.filter(x => x.id !== j.id),\n            payout: st.payout + j.pay * 0.88,\n            month: st.month + j.pay,\n            cleared: st.cleared + 1,\n            jobsDone: st.jobsDone + 1\n          }));\n          this.flash(\"Done. On Friday's payout.\");\n        }\n      })),\n\n      week: [\"Mon 13\", \"Tue 14\", \"Wed 15\", \"Thu 16\", \"Fri 17\", \"Sat 18\", \"Sun 19\"].map((d, i) => {\n        const parts = d.split(\" \");\n        const payday = i === 4;
